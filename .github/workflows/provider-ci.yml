name: provider-ci
on:
  push:
    paths:
      - 'src/provider/**'
      - '.github/workflows/provider-ci.yml'
  pull_request:
    paths:
      - 'src/provider/**'
      - '.github/workflows/provider-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/provider
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
