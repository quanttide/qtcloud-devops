name: publish-cli
on:
  release:
    types: [published]
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheel (linux_x86_64)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --auditwheel skip
          working-directory: src/cli
      - name: upload wheel to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/cli/dist/*.whl
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
      - name: build sdist
        run: uv build --sdist
        working-directory: src/cli
      - name: publish sdist to PyPI
        run: uv publish dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
