# =============================================================
# qtcloud-devops — Application archetype（应用项目默认契约）
#
# 特征：
#   - 生产构建（--release）
#   - 多 scope 多模块
#   - CI 触发发布（pre_publish 由 CI 执行）
# =============================================================

stages:
  build:
    command: cargo build --release
  test:
    command: cargo test
    threshold: 80
  release:
    changelog: CHANGELOG.md

platform:
  source_control: github
  pipeline: github_actions
  artifact_registry: crates

sources:
  version:
    type: cargo

scopes:
  cli:
    dir: src/cli
    language: rust
    build_tool: cargo
    registry: crates
