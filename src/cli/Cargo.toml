[package]
name = "qtcloud-devops-cli"
version = "0.7.0-rc.2"
edition = "2021"
description = "量潮DevOps云命令行工具"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtcloud-devops"

[lib]
name = "qtcloud_devops_cli"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "qtcloud-devops"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.19", features = ["vendored-libgit2"] }
clap = { version = "4", features = ["derive"] }
quanttide-devops = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
quanttide-agent = "0.1"

pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.coverage]
inherits = "test"
debug = 1

[package.metadata.coverage]
rust-toolchain = "stable"
command = "cargo llvm-cov --all-features --lcov --output-path target/coverage/lcov.info"
skip-features = ["python"]

[features]
default = ["cli"]
python = ["dep:pyo3"]
cli = []

[[test]]
name = "code"
path = "tests/code.rs"

[[test]]
name = "release"
path = "tests/release.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
