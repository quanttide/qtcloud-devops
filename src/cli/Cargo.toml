[package]
name = "qtcloud-devops-cli"
version = "0.1.0"
edition = "2021"
description = "Rust core for qtcloud-devops CLI"
authors = ["Guo-Zhang <zhangguo@quanttide.com>"]

[lib]
name = "qtcloud_devops_cli"
path = "app/rust/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "qtcloud-devops"
path = "app/rust/main.rs"

[dependencies]
git2 = { version = "0.19", features = ["vendored-libgit2"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

pyo3 = { version = "0.23", features = ["extension-module"] }

[dev-dependencies]
tempfile = "3"

[profile.coverage]
inherits = "test"
debug = 1

[package.metadata.coverage]
rust-toolchain = "stable"
command = "cargo llvm-cov --all-features --lcov --output-path target/coverage/lcov.info"
skip-features = ["python"]

[features]
default = ["cli"]
python = []
cli = []

[[test]]
name = "code"
path = "tests/rust/code.rs"
