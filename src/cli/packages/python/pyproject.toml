[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "qtcloud_devops_cli._native"
source-dir = "../.."
python-source = "."
manylinux = "2_28"
features = ["python"]

[project]
name = "qtcloud-devops-cli"
version = "0.3.0-rc.1"
description = "DevOps CLI — 发布管理 & 子模块管理"
requires-python = ">=3.12"
dependencies = []
