[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[project]
name = "qtcloud-devops-cli"
version = "0.1.0"
description = "DevOps CLI — 发布管理"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic-settings",
]

[project.scripts]
qtcloud-devops = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
