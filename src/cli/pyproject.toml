[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "qtcloud_devops_cli"
source-dir = "."
features = ["python"]

[project]
name = "qtcloud-devops-cli"
version = "0.1.0"
description = "DevOps CLI — 发布管理"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic-settings",
]

[project.scripts]
qtcloud-devops = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
